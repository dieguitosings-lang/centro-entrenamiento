<title>Centro de Entrenamiento Thiago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#EEF7F8; --card:#FFFFFF; --ink:#16284A; --muted:#51627E; --line:#D3E4E9; --soft:#E5F2F4; --shadow:0 6px 18px rgba(20,70,110,.09);
  --brand:#1F63D6; --brand-soft:#DCEAFF; --aqua:#0FA697; --aqua-soft:#D2F3EE; --hero:linear-gradient(135deg,#1F63D6 0%,#1386B8 55%,#0FA697 100%);
  --court:#F26B1D; --court-soft:#FDE6D8; --gold:#FFC233; --gold-ink:#6B4A00; --good:#159A63; --good-soft:#D8F3E6;
  --bad:#D2433A; --bad-soft:#FBE1DF; --warn:#C98200; --warn-soft:#FFF1CC;
  --mat:#F26B1D; --len:#7C4DFF; --ing:#2F6FED; --nat:#1E9E61; --env:#0E9AA7; --soc:#D94848; --fr:#1D4ED8; --dig:#475569;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Verdana",system-ui,sans-serif;
  --nav-h:76px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1628; --card:#172238; --ink:#EEF3FB; --muted:#A3B0C8; --line:#2A3752; --soft:#1D2A43;
    --court-soft:#3A2416; --gold-ink:#FFD66B; --brand-soft:#16294B; --aqua-soft:#0E3431; --good-soft:#123527; --bad-soft:#3A1C1A; --warn-soft:#3A2E10;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1628; --card:#172238; --ink:#EEF3FB; --muted:#A3B0C8; --line:#2A3752; --soft:#1D2A43;
  --court-soft:#3A2416; --gold-ink:#FFD66B; --brand-soft:#16294B; --aqua-soft:#0E3431; --good-soft:#123527; --bad-soft:#3A1C1A; --warn-soft:#3A2E10;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.15;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(24px,4vw,32px)} h2{font-size:22px} h3{font-size:18px}
p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ing);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:15px}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:#fff;padding:10px 16px}
:root[data-theme="dark"] .hud{background:#060B16}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hud{background:#060B16}}
.hud-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lvl{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;color:#7FE7F5}
.power{flex:1 1 220px;min-width:180px}
.power-bar{height:12px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:4px}
.power-bar i{display:block;height:100%;background:linear-gradient(90deg,#2FD3C2,#7FE7F5);border-radius:99px;transition:width .5s}
.stat{font-family:var(--display);font-size:20px;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.stat small{font-family:var(--body);font-size:12px;opacity:.75;display:block;letter-spacing:.04em}
.ball{width:22px;height:22px;flex:0 0 auto}

/* layout */
main{max-width:980px;margin:0 auto;padding:18px 16px calc(var(--nav-h) + 28px);display:grid;gap:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.eyebrow{font-family:var(--display);font-size:13px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:2px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
nav.tabs button{display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:14px;font-size:12px;font-weight:700;color:var(--muted);min-height:56px}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button[aria-current="page"]{background:var(--aqua-soft);color:var(--brand)}

/* buttons */
.btn{font-family:var(--display);font-size:18px;padding:14px 22px;border-radius:16px;background:var(--brand);color:#fff;min-height:56px;display:inline-flex;align-items:center;justify-content:center;gap:10px;letter-spacing:.02em}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.good{background:var(--good)}
.btn svg{width:22px;height:22px;flex:0 0 auto}
.btn.small{font-size:15px;padding:8px 14px;min-height:44px;border-radius:12px}
.btn:disabled{opacity:.45}
.iconbtn{width:52px;height:52px;border-radius:14px;background:var(--soft);display:grid;place-items:center;flex:0 0 auto}
.iconbtn svg{width:26px;height:26px}

/* missions */
.mission{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px;border-radius:18px;background:var(--card);border:2px solid var(--line)}
.mission .num{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-size:26px;color:#fff}
.mission.done{border-color:var(--good);background:var(--good-soft)}
.mission.done .num{background:var(--good)!important}
.mission.next{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.pause{display:flex;gap:10px;align-items:center;padding:6px 14px;color:var(--muted);font-size:15px}
.pause::before{content:"";flex:0 0 22px;height:2px;background:var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--muted);letter-spacing:.02em}
.chip.dot::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.event{display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.event:first-child{border-top:0}
.date{border-radius:14px;background:var(--soft);text-align:center;padding:6px 4px;font-family:var(--display)}
.date b{display:block;font-size:24px;font-weight:400;line-height:1}
.date span{font-size:12px;color:var(--muted);font-family:var(--body);font-weight:700;letter-spacing:.06em}
.date.soon{background:var(--brand);color:#fff}.date.soon span{color:#fff}

/* subjects */
.subj{display:grid;gap:10px;text-align:left;padding:16px;border-radius:20px;background:var(--card);border:2px solid var(--line);border-left-width:10px}
.subj .bar,.mbar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.subj .bar i,.mbar i{display:block;height:100%;border-radius:99px}
.topic{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--card);border:2px solid var(--line)}
.mastery{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;border:3px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.mastery.m3{border-color:var(--good);color:var(--good)} .mastery.m2{border-color:var(--gold);color:var(--gold-ink)} .mastery.m1{border-color:var(--bad);color:var(--bad)}

/* study + quiz */
.study-kid{font-size:22px;line-height:1.5;font-weight:700}
.points{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.points li{padding:12px 14px;border-radius:14px;background:var(--soft);font-size:19px}
.timer{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--aqua);transition:width 1s linear}
.q{font-size:clamp(22px,3.4vw,28px);font-weight:700;line-height:1.35}
.opts{display:grid;gap:12px}
.opt{text-align:left;font-size:21px;font-weight:700;padding:18px 20px;border-radius:18px;background:var(--card);border:3px solid var(--line);min-height:64px}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.feedback{padding:14px 16px;border-radius:16px;font-size:19px}
.feedback.ok{background:var(--good-soft)} .feedback.no{background:var(--warn-soft)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)} .dots i.now{background:var(--brand)}
.big-result{text-align:center;display:grid;gap:10px;justify-items:center;padding:10px 0}
.big-result .score{font-family:var(--display);font-size:56px;line-height:1}

/* tables */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.tbtn{padding:14px 6px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-family:var(--display);font-size:24px;display:grid;gap:4px;justify-items:center}
.tbtn small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:700}
.tbtn.best{border-color:var(--good)}
.mult{font-family:var(--display);font-size:clamp(44px,9vw,72px);text-align:center;font-variant-numeric:tabular-nums}
.answer{font-family:var(--display);font-size:44px;text-align:center;min-height:64px;border-bottom:4px solid var(--line);max-width:260px;margin:0 auto;font-variant-numeric:tabular-nums}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:0 auto;width:100%}
.pad button{font-family:var(--display);font-size:28px;padding:14px 0;border-radius:16px;background:var(--soft);min-height:64px}
.pad .go{background:var(--brand);color:#fff}

/* forms/tables */
label.f{display:grid;gap:6px;font-weight:700;font-size:15px}
input[type=text],input[type=date],select,textarea{font:inherit;font-size:17px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%;max-width:100%}
textarea{min-height:96px;resize:vertical}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:16px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;color:var(--muted)}
td.low{color:var(--bad);font-weight:700}
.todo{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.todo:first-child{border-top:0}
.todo input{width:26px;height:26px;accent-color:var(--good);flex:0 0 auto;margin-top:2px}
.todo.done span{text-decoration:line-through;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:9;max-width:90vw}
.banner{padding:14px 16px;border-radius:16px;background:var(--warn-soft);font-size:16px}
.overlay{position:fixed;inset:0;z-index:8;background:rgba(10,16,30,.6);display:grid;place-items:center;padding:16px}
.overlay .card{max-width:440px;width:100%;text-align:center;display:grid;gap:14px;justify-items:center}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.pop{animation:pop .3s ease-out}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* v2: english media */
.gtable{border-collapse:separate;border-spacing:0;width:100%;border-radius:16px;overflow:hidden;border:2px solid var(--line);font-size:18px}
.gtable th{background:var(--ing);color:#fff;font-family:var(--display);font-size:14px;letter-spacing:.05em;padding:10px 12px;text-align:left}
.gtable td{padding:10px 12px;border-top:1px solid var(--line);font-weight:700}
.gtable tr:nth-child(even) td{background:var(--soft)}
.lrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:var(--soft)}
.lrow span{flex:1;font-size:19px;font-weight:700}
.lrow.now{outline:3px solid var(--gold);background:var(--warn-soft)}
.mini{width:44px;height:44px;border-radius:12px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;flex:0 0 auto;font-size:18px}
.mini svg{width:22px;height:22px}
.vids{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.vid{border:2px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);display:grid}
.vid .thumb{position:relative;aspect-ratio:16/9;background:#000 center/cover no-repeat;border:0;width:100%;max-width:100%}
.vid .thumb::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;font-size:44px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.vid iframe{width:100%;aspect-ratio:16/9;border:0;display:block;max-width:100%}
.vid .vt{padding:10px 12px;display:grid;gap:6px}
.vid .vt a{font-size:14px;font-weight:700}
.words{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.word{display:grid;justify-items:center;gap:4px;text-align:center;padding:14px 8px;border-radius:18px;background:var(--card);border:2px solid var(--line);position:relative}
.word .em{font-size:44px;line-height:1.1}
.word .w{font-size:20px;font-weight:700}
.word .es{font-size:14px;color:var(--muted)}
.word.known{border-color:var(--good)}
.word.known::after{content:"✓";position:absolute;top:6px;right:10px;color:var(--good);font-weight:700}
.emo{width:1em;height:1em;vertical-align:-.12em;display:inline-block;user-select:none}
.bigemoji{font-size:72px;line-height:1;text-align:center}
.weekcard{border-color:var(--ing);background:linear-gradient(0deg,var(--card),var(--card))}
.toggle{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.toggle input{width:22px;height:22px;accent-color:var(--ing)}


/* v5: instrucciones claras */
.how{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start;padding:14px 16px;border-radius:18px;background:var(--gold-soft,#FFF4D6);border:2px solid var(--gold,#F2B705)}
.how h3{margin:0;font-size:17px;letter-spacing:.02em;color:var(--gold-ink,#6B4E00)}
.how ol{grid-column:1 / -1;margin:0;padding-left:26px;display:grid;gap:6px;font-size:19px;line-height:1.4;font-weight:600}
.how .tip{grid-column:1 / -1;margin:4px 0 0;padding:10px 12px;border-radius:12px;background:var(--card);font-size:18px;line-height:1.4}
.how.compact ol{font-size:17px}
.blank{display:inline-block;min-width:3.2em;height:1.05em;margin:0 .25em;border-bottom:4px solid var(--brand);vertical-align:-.1em;border-radius:2px;background:var(--brand-soft)}
.mission .what{display:block;font-size:15px;color:var(--muted);font-weight:600;margin-top:2px}

/* v6: interfaz simple y orgánica: una acción principal por pantalla */
.card{border:0;box-shadow:var(--shadow);border-radius:26px}
.hud-in{flex-wrap:nowrap}
.parents{display:grid;justify-items:center;gap:0;color:#fff;opacity:.85;font-size:11px;font-weight:700;padding:4px 8px;border-radius:12px;min-width:48px;min-height:48px}
.parents svg{width:22px;height:22px}
nav.tabs .in{grid-template-columns:repeat(4,1fr)!important}
nav.tabs button{font-size:14px;min-height:62px}
nav.tabs button svg{width:30px;height:30px}
.hello{display:flex;align-items:center;gap:14px;padding:4px 4px 0}
.hello h1{font-size:clamp(26px,5vw,34px)}
.track{display:flex;gap:10px;align-items:center}
.track .b{width:48px;height:48px;cursor:pointer;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:3px dashed var(--line);font-family:var(--display);font-size:16px;color:var(--muted)}
.track .b.done{background:var(--aqua);border:3px solid var(--aqua);color:#fff}
.track .b.now{border:3px solid var(--brand);color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px var(--brand-soft)}
.track .b.done.now{background:var(--aqua);color:#fff;border-color:var(--brand)}
.track .b svg{width:24px;height:24px}
.hero{position:relative;overflow:hidden;display:grid;gap:14px;padding:26px 22px;border-radius:32px;color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.12)}
.hero::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:46% 54% 58% 42%/48% 44% 56% 52%;background:rgba(255,255,255,.14)}
.hero::after{content:"";position:absolute;left:-40px;bottom:-70px;width:180px;height:180px;border-radius:58% 42% 45% 55%/52% 58% 42% 48%;background:rgba(255,255,255,.1)}
.hero>*{position:relative;z-index:1}
.hero .top{display:flex;align-items:center;gap:14px}
.hero .ic{width:68px;height:68px;border-radius:22px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:0 0 auto}
.hero .ic svg{width:40px;height:40px}
.hero .lab{font-family:var(--display);font-size:14px;letter-spacing:.08em;opacity:.9;text-transform:uppercase}
.hero h2{font-size:clamp(26px,5vw,34px);color:#fff;margin-top:6px}
.subj-pill{display:inline-flex;align-items:center;gap:6px;margin-top:6px;background:#fff;color:var(--ink);font-weight:700;font-size:14px;padding:4px 12px 4px 8px;border-radius:99px}
.subj-pill i{width:12px;height:12px;border-radius:50%}
.hero p{font-size:19px;opacity:.95}
.hero .go{justify-self:start;font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.03em;background:#fff;color:var(--ink);padding:16px 34px;border-radius:999px;min-height:64px;box-shadow:0 8px 20px rgba(0,40,80,.22);display:inline-flex;gap:12px;align-items:center}
.hero .go:active{transform:translateY(2px);box-shadow:0 4px 10px rgba(0,40,80,.22)}
.hero .go svg{width:26px;height:26px}
.breath{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:22px;background:var(--good-soft);font-size:17px;font-weight:600}
.breath svg{width:30px;height:30px;flex:0 0 auto;color:var(--good)}
.soon{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 16px;border-radius:22px;background:var(--card);box-shadow:var(--shadow)}
.soon .d{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:#fff;font-family:var(--display);line-height:1;text-align:center;flex:0 0 auto}
.soon .d small{display:block;font-size:11px;font-family:var(--body);font-weight:700;letter-spacing:.06em}
.soon b{display:block;font-size:18px}
.soon>span>span{color:var(--muted);font-size:15px}.soon b{color:var(--ink)}
.linkbtn{justify-self:center;color:var(--muted);font-weight:700;font-size:16px;text-decoration:underline;text-underline-offset:4px;min-height:44px;padding:8px 12px}
.doors{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media (min-width:760px){.doors{grid-template-columns:repeat(3,1fr)}}
.door{position:relative;overflow:hidden;display:grid;gap:8px;justify-items:start;text-align:left;padding:18px;border-radius:28px;min-height:150px;background:var(--c);color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.10)}
.door::after{content:"";position:absolute;right:-30px;bottom:-40px;width:120px;height:120px;border-radius:50% 45% 55% 50%/55% 50% 50% 45%;background:rgba(255,255,255,.16)}
.door .ic{width:52px;height:52px;border-radius:18px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.door .ic svg{width:32px;height:32px}
.door b{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.1}
.door span{font-size:13px;opacity:.9;font-weight:700}
.door .stars{position:relative;z-index:1;font-size:15px;font-weight:700;background:rgba(0,0,0,.14);padding:3px 10px;border-radius:99px}
.door .flag{position:absolute;top:12px;right:12px;z-index:1;background:#fff;color:var(--ink);font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px}
.shead{display:flex;gap:14px;align-items:center;padding:18px;border-radius:28px;color:#fff;background:var(--c)}
.shead .ic{width:60px;height:60px;border-radius:20px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:0 0 auto}
.shead .ic svg{width:36px;height:36px}
.shead h1{color:#fff}
.shead .back{margin-left:auto;background:rgba(255,255,255,.22);color:#fff;border-radius:16px;padding:10px 14px;font-weight:700;min-height:48px}
.grp{display:grid;gap:10px}
.grp>h2{display:flex;align-items:center;gap:10px;font-size:20px}
.grp>h2 i{width:14px;height:14px;border-radius:50%;background:var(--c)}
.grp>p{color:var(--muted);font-size:15px;margin-top:-4px}
details.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:20px;padding:12px 16px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);min-height:56px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"+";margin-left:auto;font-size:26px;color:var(--muted)}
details.grp[open]>summary::after{content:"–"}
.topic{border:0;box-shadow:var(--shadow);border-radius:22px;min-height:64px}
.topic .st{font-size:18px;letter-spacing:1px;color:var(--gold);white-space:nowrap}
.topic .st .off{color:var(--line)}
.topic .tag{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand);vertical-align:2px}
@media (prefers-reduced-motion:no-preference){.hero{animation:pop .35s ease-out}@keyframes pop{from{opacity:0}to{opacity:1}}}
/* v3: cancha */
.shots{font-family:var(--display);font-size:20px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);padding:6px 12px;border-radius:14px;color:#fff;font-variant-numeric:tabular-nums}
.shots small{font-family:var(--body);font-size:12px;opacity:.75;display:block;letter-spacing:.04em}
.court-wrap{position:relative;border-radius:20px;overflow:hidden;border:3px solid var(--court);background:#1B2A4A;touch-action:none}
.court-wrap canvas{display:block;width:100%;height:auto;max-width:100%;touch-action:none;cursor:grab}
.court-hud{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.pill{font-family:var(--display);font-size:16px;padding:8px 14px;border-radius:14px;background:var(--soft);font-variant-numeric:tabular-nums}
.pill.hot{background:var(--court);color:#fff}
.energy{display:flex;gap:6px}
.energy i{width:22px;height:22px;border-radius:50%;border:3px solid var(--court);background:transparent}
.energy i.on{background:var(--court)}
.badges{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.badge2{display:grid;justify-items:center;gap:4px;text-align:center;padding:14px 8px;border-radius:18px;border:2px solid var(--line);background:var(--card)}
.badge2 .em{font-size:38px;line-height:1}
.badge2.off{opacity:.4;filter:grayscale(1)}
.badge2 b{font-size:15px}.badge2 span{font-size:12px;color:var(--muted)}
.lock{display:grid;gap:12px;justify-items:center;text-align:center;padding:24px 16px}
.lock .em{font-size:64px;line-height:1}
@media (max-width:520px){.mission{grid-template-columns:52px 1fr}.mission .num{width:52px;height:52px;font-size:22px}.mission .btn{grid-column:1 / -1}}

/* v12: agenda en el menú principal: todo lo que viene, con anticipación */
.agenda{display:grid;gap:10px}
.agenda>h2{display:flex;align-items:center;gap:10px;font-size:22px}
.agenda>p{color:var(--muted);font-size:15px;margin-top:-4px}
.ag{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:14px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);border-left:8px solid var(--c)}
.ag.done{opacity:.55}
.ag .d{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;color:#fff;background:var(--c);font-family:var(--display);line-height:1;text-align:center;font-size:24px}
.ag .d small{display:block;font-size:11px;font-family:var(--body);font-weight:700;letter-spacing:.06em}
.ag .k{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--c);text-transform:uppercase}
.ag .k .when{color:var(--ink);background:var(--soft);padding:2px 8px;border-radius:99px;margin-left:6px;text-transform:none;letter-spacing:0}
.ag .k .when.hot{background:var(--bad);color:#fff}
.ag b.t{display:block;font-size:18px;line-height:1.3;margin-top:2px}
.ag .det{font-size:16px;line-height:1.4;margin-top:4px}
.ag .tops{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ag .tops button{font-size:14px;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--soft);min-height:36px}
.ag .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ag .acts .btn{min-height:44px}
@media (max-width:520px){.ag{grid-template-columns:1fr}.ag .d{width:auto;height:auto;padding:8px;justify-self:start;font-size:18px}}

const $=s=>document.querySelector(s);

const EMO_RE=/(?:[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{2300}-\u{23FF}]\uFE0F?(?:\u200D[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]\uFE0F?)*)/gu;
function txt(v){return esc(v).replace(EMO_RE,m=>EMO[m.replace(/\uFE0F/g,"")]?emo(m):m)}
function emo(e){const k=String(e||"").replace(/\uFE0F/g,""),u=EMO[k];return u?'<img class="emo" alt="" draggable="false" src="'+u+'">':esc(e)}
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pad2=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const today=()=>ymd(new Date());
const parseD=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const daysUntil=s=>Math.round((parseD(s)-parseD(today()))/864e5);
const MES=["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];

const store={get(k,d){try{const v=localStorage.getItem("tc_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("tc_"+k,JSON.stringify(v))}catch(e){}}};

/* speech */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]}}

/* Elige la voz más natural disponible en el dispositivo (no la primera que aparece). */
function voiceScore(v,lang){
  const n=(v.name||"")+" "+(v.voiceURI||""),l=(v.lang||"").replace("_","-").toLowerCase(),want=lang.toLowerCase(),pre=want.slice(0,2);
  if(!l.startsWith(pre))return -1e9;
  let sc=0;
  if(/natural/i.test(n))sc+=120;                       // Edge: "Microsoft Ana Online (Natural)"
  if(/neural|premium|enhanced|mejorad|siri/i.test(n))sc+=90; // iPad / Mac voces mejoradas
  if(/google/i.test(n))sc+=70;                         // Chrome / Android
  if(v.localService===false)sc+=25;
  if(/espeak|desktop|compact/i.test(n))sc-=120;        // voces robóticas
  if(/^microsoft /i.test(v.name||"")&&!/natural|online/i.test(n))sc-=60; // SAPI de Windows
  if(pre==="es"){if(/es-(us|mx|419|ec|co)/.test(l))sc+=35;else if(l==="es-es")sc+=5;
    if(/paulina|m[oó]nica|dalia|elvira|andrea|sabina|marisol/i.test(n))sc+=20}
  if(pre==="en"){if(l==="en-us")sc+=30;else if(l==="en-gb")sc+=10;
    if(/\bana\b|aria|jenny|samantha|ava|allison|emma/i.test(n))sc+=20}
  return sc;
}
function bestVoice(lang){
  const key=lang.startsWith("en")?"voiceEn":lang.startsWith("es")?"voiceEs":null,saved=key?store.get(key,""):"";
  if(saved){const v=voices.find(x=>x.name===saved);if(v)return v}
  let best=null,bs=-1e9;voices.forEach(v=>{const sc=voiceScore(v,lang);if(sc>bs){bs=sc;best=v}});
  return bs>-1e9?best:null;

/* Marca interna de pausa: los espacios en blanco (___) y los "…" se convierten en silencio, no se leen. */
const PAUSE_MARK="‖";
function cleanForSpeech(text,lang){
  const en=lang.startsWith("en");
  return String(text)
    .replace(/_{2,}|…|\.{3}/g," "+PAUSE_MARK+" ")                  // blanco o puntos suspensivos = pausa
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}\u{2B00}-\u{2BFF}]/gu,"") // emojis fuera
    .replace(/(\d)[   ](?=\d{3}\b)/g,"$1")                        // 2 536 -> 2536
    .replace(/=\s*\?/g,en?" equals what?":" es igual a ¿cuánto?")
    .replace(/\s=\s/g,en?" equals ":" es igual a ")
    .replace(/[−–](?=\s*\d)/g,en?" minus ":" menos ").replace(/\s\+\s/g,en?" plus ":" más ")
    .replace(/[·•]/g,", ").replace(/→/g,", ")
    .replace(/×/g,en?" times ":" por ").replace(/[«»"“”]/g,"")
    .replace(/\(([^)]*)\)/g,", $1, ").replace(/\s*\/\s*/g,en?" or ":" o ")
    .replace(/\s+/g," ").trim();
}
/* Parte el texto en trozos cortos. Cada trozo sabe cuánto silencio va después. */
function speechChunks(text,lang){
  const out=[];
  cleanForSpeech(text,lang).split(PAUSE_MARK).forEach((seg,si,arr)=>{
    const sent=(seg.match(/[^.!?;:¿¡]+[.!?;:]*|[¿¡][^.!?;:]*[.!?;:]*/g)||[]).map(x=>x.trim()).filter(x=>/[\p{L}\p{N}]/u.test(x));
    sent.forEach((t,k)=>out.push({t,gap:k<sent.length-1?280:0}));
    if(si<arr.length-1){if(out.length)out[out.length-1].gap=950;else out.push({t:"",gap:950})}
  });
  return out;
}
function hasVoice(lang){return !!bestVoice(lang)}
let sayGen=0;
/* say(): habla uno o varios textos (cada uno con su idioma) en orden, con pausas reales. */
function sayParts(list,onend){
  if(!("speechSynthesis" in window)){onend&&setTimeout(onend,600);return}
  const gen=++sayGen;
  try{speechSynthesis.cancel()}catch(e){}
  if(!voices.length)loadVoices();
  const userRate=store.get("voiceRate",1),q=[];
  list.forEach(it=>{
    if(!it||!it.t)return;const lang=it.lang||"es-US",v=bestVoice(lang);
    const r=Math.max(.6,Math.min(1.2,(it.rate||.9)*userRate+(v&&/natural|google|neural|premium|enhanced/i.test(v.name)?.05:0)));
    speechChunks(it.t,lang).forEach(c=>q.push({...c,lang,v,r}));
    if(q.length&&it.gapAfter)q[q.length-1].gap=Math.max(q[q.length-1].gap,it.gapAfter);
  });
  let i=0;
  const step=()=>{
    if(gen!==sayGen)return;
    if(i>=q.length){onend&&onend();return}
    const c=q[i++];let moved=false;
    const go=()=>{if(moved||gen!==sayGen)return;moved=true;clearTimeout(guard);setTimeout(step,c.gap)};
    if(!c.t){go();return}

    u.lang=c.v?c.v.lang.replace("_","-"):c.lang;if(c.v)u.voice=c.v;u.rate=c.r;u.pitch=1;u.volume=1;

const best=id=>{const t=S.prog&&S.prog.topics[id];return t?t.best:-1};

function subjStats(s){
  const ts=Object.entries(S.topics).filter(([,t])=>t.subject===s);
  const played=ts.filter(([id])=>best(id)>=0);
  const mastered=ts.filter(([id])=>best(id)>=.8).length;
  return{total:ts.length,mastered,pct:ts.length?mastered/ts.length:0,played:played.length};
}
function sortedTopics(s){
  return Object.entries(S.topics).filter(([,t])=>t.subject===s).sort((a,b)=>(a[1].quim===b[1].quim?0:b[1].quim-a[1].quim)||(a[1].priority-b[1].priority)||(a[1].order-b[1].order));
}
function upcoming(days){
  return Object.entries(S.events).filter(([,e])=>!e.done&&e.date&&daysUntil(e.date)>=0&&daysUntil(e.date)<=days).sort((a,b)=>a[1].date.localeCompare(b[1].date));
}
function pickTopic(s,exclude){
  exclude=exclude||[];
  const soon=new Set();upcoming(10).forEach(([,e])=>(e.topics||[]).forEach(t=>soon.add(t)));
  const list=Object.entries(S.topics).filter(([id,t])=>t.subject===s&&!exclude.includes(id)&&(t.quiz||[]).length);
  if(!list.length)return null;
  const isNew=t=>t.added&&daysUntil(t.added)>=-6;
  const score=([id,t])=>{const b=best(id);let v=0;if(soon.has(id))v-=100;if(t.status==="actual")v-=30;if(isNew(t)&&b<.8)v-=25;v+=t.priority*8;v+=b<0?0:b*60;if(b>=.8)v+=80;return v};
  list.sort((a,b)=>score(a)-score(b));return list[0][0];
}
function weakestTable(){
  const tb=S.prog?S.prog.tables:{};let pick=null,val=2;
  for(let n=2;n<=10;n++){const b=tb[n]?tb[n].best:-1;if(b<val){val=b;pick=n}}
  return pick||"mix";
}

/* ============ weekend plan ============ */
/* v9: el plan pone primero las evaluaciones. Mañana = Misión 1. Fin de semana = evaluaciones de los próximos 7 días,
   de la más cercana a la más lejana. Las tablas van siempre al final. Funciona cualquier día. */
function evalTopics(e){return (e.topics||[]).filter(t=>S.topics[t])}
function evalBlocks(id,e){
  const out=[],tops=evalTopics(e);
  if(e.subject==="ing"&&e.kind==="exposicion")out.push({kind:"ensayo",eid:id,sub:"ing",title:"Ensayo: "+e.title});
  if(e.spell){out.push({kind:"spell",eid:id,sub:"ing",title:"Deletrea: "+e.title});return out}
  if(tops.some(t=>(S.topics[t].quiz||[]).length))out.push({kind:"evento",eid:id,sub:e.subject,title:"Repaso: "+e.title});
  return out;
}
function evalsAhead(maxDays){return Object.entries(S.events).filter(([,e])=>!e.done&&e.date&&daysUntil(e.date)>=1&&daysUntil(e.date)<=maxDays).sort((a,b)=>a[1].date.localeCompare(b[1].date)||((a[1].prio||5)-(b[1].prio||5)))}
function evalTomorrow(){return evalsAhead(1)}
function planFor(dateStr){
  const d=parseD(dateStr),dow=d.getDay(),sunday=dow===0,weekend=dow===0||dow===6;
  const tab=weakestTable(),tabla={kind:"tabla",n:sunday?"mix":tab,title:sunday?"Tablas: mezcla":"Tabla del "+tab,sub:"mat"};
  const blocks=[],max=3;
  const wide=weekend||store.get("freeDate",null)===dateStr;
  let evs=evalsAhead(wide?7:1);
  /* entre semana: si mañana no hay nada que repasar, mira pasado mañana */
  if(!wide&&!evs.some(([id,e])=>evalBlocks(id,e).length))evs=evalsAhead(2);
  /* v12: con anticipación: si en 2 días no hay nada, repasa lo de los próximos 7 días */
  if(!wide&&!evs.some(([id,e])=>evalBlocks(id,e).length))evs=evalsAhead(7);
  for(const [id,e] of evs){for(const b of evalBlocks(id,e)){if(blocks.length<max)blocks.push(b)}}
  if(weekend||store.get("freeDate",null)===dateStr){
    const used=[];
    evs.forEach(([,e])=>evalTopics(e).forEach(t=>used.push(t)));
    const add=s=>{if(blocks.length>=3)return;const id=pickTopic(s,used);if(id){used.push(id);blocks.push({kind:"topic",id,sub:s,title:S.topics[id].title})}};
    const fill=sunday?[()=>{if(blocks.length<3&&!blocks.some(b=>b.kind==="vocab"))blocks.push({kind:"vocab",sub:"ing",title:"Palabras en inglés: escucha y elige"})},()=>add("nat"),()=>{if(blocks.length<3)blocks.push({kind:"partido",sub:"mix",title:"Partido: preguntas mezcladas"})}]
                     :["mat","ing","len"].map(s=>{const id=pickTopic(s,used),t=id&&S.topics[id];return{s,n:t&&t.added&&daysUntil(t.added)>=-6?1:0}}).sort((a,b)=>b.n-a.n).map(o=>()=>add(o.s));
    fill.forEach(f=>f());
  }
  blocks.push(tabla);
  return blocks;
}

function viewHoy(){
  const t=today(),dow=new Date().getDay(),weekend=dow===0||dow===6;
  const nm=store.get("kidname","Thiago");
  const tmr=evalTomorrow(),two=evalsAhead(2).filter(([id,e])=>daysUntil(e.date)===2&&evalBlocks(id,e).length);
  const week=evalsAhead(7).filter(([id,e])=>evalBlocks(id,e).length);
  const active=weekend||store.get("freeDate",null)===t||tmr.length>0||two.length>0||week.length>0;
  const sub=weekend?(dow===6?'Sábado':'Domingo')+' de entrenamiento'+(tmr.length?' · mañana: '+tmr[0][1].title:''):tmr.length?'Mañana tienes: '+tmr[0][1].title:two.length?'Pasado mañana: '+two[0][1].title:week.length?'Adelántate: '+week[0][1].title+' ('+DIA[parseD(week[0][1].date).getDay()]+')':'Hoy '+DIA[dow]+' es día de descanso';
  let h='<section class="hello"><div><h1>¡Hola, '+esc(nm)+'!</h1><p class="muted">'+esc(sub)+'</p></div></section>';
  if(active){
    const blocks=planFor(t),ses=sessionOf(t);S.plan={date:t,blocks};
    const nextIdx=blocks.findIndex((b,i)=>!ses.done.includes(i));

    '<input id="spIn" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" aria-label="Escribe la palabra" placeholder="escribe aquí" style="font-size:30px;text-align:center;padding:14px;border-radius:18px;border:3px solid var(--line);font-family:var(--display);letter-spacing:.06em;width:100%">'+

/* quiz */
/* Francés: las preguntas están en español; solo el audio «Escucha» va en francés. */
function qLang(s){return s==="fr"?"es-US":(SUBJ[s]||{}).lang}
function startQuiz(id,mode){
  let qs=[];
  if(mode==="event"){
    const e=S.events[id]||{},tops=evalTopics(e).filter(t=>(S.topics[t].quiz||[]).length);
    const bags=tops.map(t=>shuffle(S.topics[t].quiz).map(q=>({...q,tid:t,lang:qLang(S.topics[t].subject),llang:(SUBJ[S.topics[t].subject]||{}).lang})));
    for(let r=0;qs.length<8&&bags.some(b=>b.length);r++){const b=bags[r%bags.length];if(b.length)qs.push(b.shift())}
  }else if(mode==="mix"){
    const pool=Object.entries(S.topics).filter(([,t])=>(t.quiz||[]).length);
    const weak=pool.filter(([tid])=>best(tid)>=0&&best(tid)<.8);
    const src=shuffle(weak.length>=3?weak:pool).slice(0,10);
    src.forEach(([tid,t])=>{const q=shuffle(t.quiz)[0];qs.push({...q,tid,lang:qLang(t.subject),llang:(SUBJ[t.subject]||{}).lang})});
  }else{
    const t=S.topics[id];qs=shuffle(t.quiz).slice(0,6).map(q=>({...q,tid:id,lang:qLang(t.subject),llang:(SUBJ[t.subject]||{}).lang}));
  }
  qs=qs.map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return{...q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)}});
  S.quiz={id,mode,qs,i:0,res:[],answered:false};
  S.view="quiz";render();window.scrollTo(0,0);
}
function viewQuiz(){
  const Q=S.quiz;if(!Q){setView("hoy");return}
  if(Q.i>=Q.qs.length)return quizEnd();
  const q=Q.qs[Q.i];
  const t=S.topics[q.tid]||{},sj=SUBJ[t.subject]||{c:"var(--court)"};
  let h='<section class="card" style="display:grid;gap:16px;border-top:8px solid '+sj.c+'">'+timerHtml()+
    '<div class="row spread"><button class="btn small ghost" id="quit">Salir</button><div class="dots">'+Q.qs.map((_,k)=>'<i class="'+(k<Q.res.length?(Q.res[k]?'ok':'no'):(k===Q.i?'now':''))+'"></i>').join("")+'</div></div>'+
    (Q.mode==="mix"?'<span class="chip dot" style="color:'+sj.c+'">'+esc(t.title||"")+'</span>':'')+
    howHtml(howQuiz(q,t),TIPS[q.tid],true)+(q.listen?'<div class="card" style="display:grid;gap:10px;justify-items:center;background:var(--sky-soft,var(--soft));border-color:var(--ing)"><p class="eyebrow" style="color:var(--ing)">Listening</p><div class="row" style="justify-content:center"><button class="btn" id="playL" style="background:var(--ing)">'+SPEAK+' Escuchar</button><button class="btn soft" id="slowL">'+SLOW+' Lento</button></div></div>':'')+
    '<div class="row" style="align-items:flex-start;flex-wrap:nowrap"><p class="q" style="flex:1">'+qTextHtml(q.q)+'</p><button class="iconbtn" id="sayQ" aria-label="Escuchar la pregunta">'+SPEAK+'</button>'+(q.lang===EN?'<button class="iconbtn" id="slowQ" aria-label="Escuchar lento">'+SLOW+'</button>':'')+'</div>'+
    '<div class="opts">'+q.o.map((o,k)=>'<button class="opt" data-k="'+k+'">'+esc(o)+'</button>').join("")+'</div><div id="fb"></div></section>';
  main.innerHTML=h;startTimer();
  $("#quit").onclick=()=>{S.quiz=null;S.activeBlock?setView("hoy"):(q.tid&&Q.mode!=="mix"?openTopic(q.tid):setView("hoy"))};
  const steps=howQuiz(q,t),tip=TIPS[q.tid];bindHow(steps,tip);
  const readQ=r=>({t:q.q+" "+PAUSE_MARK+" "+q.o.join(". ")+".",lang:q.lang||"es-US",rate:r});
  $("#sayQ").onclick=()=>sayParts([readQ(q.lang===EN?.85:.9)]);
  const sq=$("#slowQ");if(sq)sq.onclick=()=>sayParts([readQ(.6)]);
  const kind=(q.listen?"L":hasBlank(q.q)?"B":"M")+(q.lang===EN?"en":"es")+(Q.mode==="mix"?"":q.tid);
  const LL=q.llang||EN;
  if(q.listen){$("#playL").onclick=()=>say(q.listen,LL,.85);$("#slowL").onclick=()=>say(q.listen,LL,.55);setTimeout(()=>autoHow(kind,steps,tip,[{t:q.listen,lang:LL,rate:.85}]),350)}
  else setTimeout(()=>autoHow(kind,steps,tip,(q.lang===EN&&store.get("autoread",true))?[{t:q.q,lang:EN,rate:.85}]:[]),350);
  main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(Q.answered)return;Q.answered=true;const k=+b.dataset.k,ok=k===q.a;
    main.querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add("ok")});
    if(!ok)b.classList.add("no");
    Q.res.push(ok);if(ok){S.prog.baskets+=1;addXp(XP_OK);earn(1)}
    if(q.lang===EN)say(hasBlank(q.q)?q.q.replace(/_{2,}/,q.o[q.a]):q.o[q.a],EN,.85);
    $("#fb").innerHTML='<div class="feedback '+(ok?'ok':'no')+' pop"><b>'+(ok?'¡Canasta! +2 ':'Casi. ')+'</b>'+esc(q.e||"")+(q.listen?'<br><span class="small">Audio: «'+esc(q.listen)+'»</span>':'')+'<br><span class="small muted">Lee la explicación y toca «'+(Q.i+1<Q.qs.length?'Siguiente':'Ver resultado')+'».</span></div><button class="btn" id="nextQ" style="width:100%;margin-top:12px">'+(Q.i+1<Q.qs.length?'Siguiente':'Ver resultado')+'</button>';
    $("#nextQ").onclick=()=>{Q.i++;Q.answered=false;viewQuiz();window.scrollTo(0,0)};
  });
}
function quizEnd(){
  const Q=S.quiz,ok=Q.res.filter(Boolean).length,n=Q.res.length,ratio=n?ok/n:0;
  if(Q.mode!=="mix"&&Q.mode!=="event"&&Q.id){const prev=S.prog.topics[Q.id]||{best:0,tries:0};S.prog.topics[Q.id]={best:Math.max(prev.best||0,ratio),tries:(prev.tries||0)+1,last:today()}}
  const perfect=ok===n&&n>0;if(perfect){addXp(XP_PERFECT);giveShots(1,"¡todo perfecto!")}
  const wasBlock=!!S.activeBlock;completeBlock();saveProg();stopTimer();
  const msg=perfect?"¡Triple! Todo perfecto":ratio>=.8?"¡Gran partido!":ratio>=.5?"Buen entrenamiento":"Hay que entrenar más este tema";
  main.innerHTML='<section class="card big-result pop"><p class="eyebrow">Resultado</p><div class="score">'+ok+' / '+n+'</div><h2>'+msg+'</h2><p class="muted">+'+(ok*2)+' puntos en canastas'+(perfect?' · bono triple +'+XP_PERFECT*10+' de poder':'')+'</p><div class="row" style="justify-content:center;margin-top:8px">'+(wasBlock?'<button class="btn" id="goPlan">Pausa y siguiente misión</button>':'<button class="btn" id="again">Otra vez</button>')+(Q.id&&Q.mode!=="event"?'<button class="btn ghost" id="study">Volver a estudiar</button>':'')+'</div></section>';
  const g=$("#goPlan");if(g)g.onclick=()=>{S.quiz=null;setView("hoy")};
  const a=$("#again");if(a)a.onclick=()=>startQuiz(Q.id,Q.mode);
  const s=$("#study");if(s)s.onclick=()=>{S.quiz=null;openTopic(Q.id)};
}

/* ===== Palabras (vocab) ===== */

function allGroups(){return Object.entries(S.vocab).sort((a,b)=>(a[1].order||0)-(b[1].order||0))}

    '<button class="door" id="vgSay" style="--c:#16804F"><span class="ic">'+IC.ing+'</span><b>¿Cómo se dice?</b><span>Mira el dibujo y elige en inglés</span></button>'+
    '<button class="door" id="vgEnsayo" style="--c:#6A3FE0"><span class="ic">'+IC.mic+'</span><b>Ensayo</b><span>Practica tu exposición</span></button>'+
    (spellWords().length?'<button class="door" id="vgSpell" style="--c:#0B7C87"><span class="ic">'+IC.len+'</span><b>Spelling Bee</b><span>Escucha y escribe la palabra</span></button>':'')+'</section>';

  h+='<section class="words">'+words.map((w,i)=>'<button class="word'+(vKnown(w.w)?' known':'')+'" data-wi="'+i+'"><span class="em">'+emo(w.emoji)+'</span><span class="w">'+esc(w.w)+'</span><span class="es">'+esc(w.es)+'</span></button>').join("")+'</section>';
  h+='<section class="card" id="wdetail" hidden></section>';

    d.scrollIntoView({behavior:"smooth",block:"nearest"});

function startVGame(groupIds,mode){
  const pool=[];groupIds.forEach(g=>{const G=S.vocab[g];if(G)(G.words||[]).forEach(w=>pool.push(w))});
  if(pool.length<4){toast("Faltan palabras en este grupo.");return}
  const rounds=shuffle(pool).slice(0,Math.min(10,pool.length)).map(w=>{const others=shuffle(pool.filter(x=>x.w!==w.w)).slice(0,3);const o=shuffle([w,...others]);return{w,o,a:o.indexOf(w)}});
  S.vg={mode,rounds,i:0,res:[],answered:false};S.view="vgame";render();window.scrollTo(0,0);

/* Mezcla: sin ×1 ni ×10. 7 de 10 preguntas son de las tablas 6-9, con más peso a las de peor resultado. */
function tableWeight(n){const t=(S.prog.tables||{})[n];const b=t?t.best:-1;return b<0?1:Math.max(.15,1.15-b)}

function mixQuestions(){
  const hard=[6,7,8,9],easy=[2,3,4,5],qs=[],seen=new Set();
  const make=pool=>{for(let t=0;t<30;t++){const a=pickWeighted(pool),b=2+Math.floor(Math.random()*8),k=Math.min(a,b)+"x"+Math.max(a,b);if(!seen.has(k)||t===29){seen.add(k);return Math.random()<.5?[a,b]:[b,a]}}};
  for(let k=0;k<7;k++)qs.push(make(hard));
  for(let k=0;k<3;k++)qs.push(make(easy));
  return shuffle(qs);
}
function startDrill(n){

}

function initCourt(){

  function draw(){

    ctx.fillStyle="#C8773A";ctx.fillRect(0,FLOOR,W,H-FLOOR);
    ctx.strokeStyle="rgba(255,255,255,.55)";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(195,FLOOR);ctx.lineTo(195,FLOOR+38);ctx.stroke();
    ctx.fillStyle="rgba(255,255,255,.85)";ctx.font="700 16px Fredoka, sans-serif";ctx.fillText("3 PTS",120,FLOOR+28);ctx.fillText("2 PTS",250,FLOOR+28);
    ctx.fillStyle="#E9EEF7";ctx.fillRect(rimX+88,145,8,140);ctx.strokeStyle="#F26B1D";ctx.lineWidth=3;ctx.strokeRect(rimX+88,190,8,45);
    ctx.fillStyle="#9AA7BF";ctx.fillRect(rimX+96,215,40,8);ctx.fillRect(rimX+128,215,8,FLOOR-215);
    ctx.strokeStyle="rgba(255,255,255,.8)";ctx.lineWidth=2;for(let i=0;i<=5;i++){const x1=rimX+i*15.2,x2=rimX+13+i*10;ctx.beginPath();ctx.moveTo(x1,rimY);ctx.lineTo(x2,rimY+42);ctx.stroke()}
    ctx.beginPath();ctx.moveTo(rimX+8,rimY+20);ctx.lineTo(rimX+68,rimY+20);ctx.stroke();
    ctx.strokeStyle="#F26B1D";ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(rimX,rimY);ctx.lineTo(rimX+78,rimY);ctx.stroke();
    if(state==="ready"&&drag){const vx=(drag.sx-drag.x)*.13,vy=(drag.sy-drag.y)*.13;const m=Math.hypot(vx,vy),k=m>MAXV?MAXV/m:1;let x=ball.x,y=ball.y,ux=vx*k,uy=vy*k;ctx.fillStyle="rgba(255,194,51,.9)";for(let i=0;i<42;i++){ux=ux;uy+=G;x+=ux;y+=uy;if(i%2===0){ctx.beginPath();ctx.arc(x,y,3.5,0,7);ctx.fill()}}}
    ctx.save();ctx.translate(ball.x,ball.y);ctx.rotate((ball.x+ball.y)/40);ctx.fillStyle="#F26B1D";ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();ctx.strokeStyle="#5A2A0A";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-R,0);ctx.lineTo(R,0);ctx.moveTo(0,-R);ctx.lineTo(0,R);ctx.stroke();ctx.beginPath();ctx.arc(-R*1.1,0,R*.9,-1,1);ctx.stroke();ctx.beginPath();ctx.arc(R*1.1,0,R*.9,2.14,4.14);ctx.stroke();ctx.restore();
    if(state==="empty"){ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="700 30px Fredoka, sans-serif";ctx.fillText("Sin tiros por ahora",W/2,H/2-10);ctx.font="600 18px Fredoka, sans-serif";ctx.fillText("Responde preguntas para ganar más",W/2,H/2+24);ctx.textAlign="left"}
    if(msgT>0){msgT--;ctx.fillStyle="#FFC233";ctx.textAlign="center";ctx.font="700 54px Fredoka, sans-serif";ctx.fillText(msg,W/2,120);ctx.textAlign="left"}
  }
  cv.onpointerdown=e=>{if(state!=="ready")return;const q=toLogic(e);drag={sx:q.x,sy:q.y,x:q.x,y:q.y};try{cv.setPointerCapture(e.pointerId)}catch(_){}};
  cv.onpointermove=e=>{if(!drag)return;const q=toLogic(e);drag.x=q.x;drag.y=q.y};
  cv.onpointerup=e=>{if(!drag)return;let vx=(drag.sx-drag.x)*.13,vy=(drag.sy-drag.y)*.13;drag=null;const m=Math.hypot(vx,vy);if(m<3)return;if(m>MAXV){vx*=MAXV/m;vy*=MAXV/m}launch(vx,vy)};
  reset();upd();step();
  S.courtStop=()=>{alive=false;cancelAnimationFrame(raf)};
}
function viewPoder(){

    '<form id="evForm" style="display:grid;gap:10px;margin-top:14px;border-top:2px solid var(--line);padding-top:14px"><h3>Agregar fecha</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))"><label class="f" for="evDate">Fecha<input type="date" id="evDate" required></label><label class="f" for="evSub">Materia<select id="evSub">'+SUBJ_ORDER.map(s=>'<option value="'+s+'">'+SUBJ[s].n+'</option>').join("")+'</select></label><label class="f" for="evKind">Tipo<select id="evKind">'+Object.entries(KINDS).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join("")+'</select></label></div><label class="f" for="evTitle">Título<input type="text" id="evTitle" required placeholder="Lección semanal N°2"></label><label class="f" for="evDetail">Temas / detalle<input type="text" id="evDetail" placeholder="Temas a evaluar"></label><button class="btn" type="submit">Guardar fecha</button></form></section>';
  h+='<section class="card"><h2>Agregar tema nuevo</h2><p class="muted small">Lo que le enseñaron esta semana. Claude puede completarlo después con preguntas.</p><form id="tpForm" style="display:grid;gap:10px;margin-top:10px"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))"><label class="f" for="tpSub">Materia<select id="tpSub">'+SUBJ_ORDER.map(s=>'<option value="'+s+'">'+SUBJ[s].n+'</option>').join("")+'</select></label><label class="f" for="tpTitle">Tema<input type="text" id="tpTitle" required placeholder="Tabla del 6"></label></div><label class="f" for="tpKid">Explicación corta para Thiago<input type="text" id="tpKid" required></label><label class="f" for="tpPts">Puntos clave (uno por línea)<textarea id="tpPts"></textarea></label><button class="btn" type="submit">Guardar tema</button></form></section>';
  if(g){const rows=[["mat","Matemática"],["ing","Language Arts"],["nat","Natural Science"],["len","Lengua y Literatura"],["soc","Estudios Sociales"],["env","Environmental Science"],["total","Promedio"]];
    const cell=v=>'<td class="'+(v<8.5?'low':'')+'">'+(v!=null?v.toFixed(2):'—')+'</td>';
    h+='<section class="card"><h2>Notas 1er quimestre</h2><div class="tbl" style="margin-top:8px"><table><thead><tr><th>Materia</th><th>I P</th><th>II P</th><th>III P</th><th>Examen</th><th>Prom.</th></tr></thead><tbody>'+rows.filter(([k])=>g[k]).map(([k,n])=>'<tr><td>'+(k==="total"?'<b>'+n+'</b>':n)+'</td>'+cell(g[k].p1)+cell(g[k].p2)+cell(g[k].p3)+cell(g[k].ex)+cell(g[k].prom)+'</tr>').join("")+'</tbody></table></div><p class="muted small" style="margin-top:8px">En rojo: menos de 8.50. Prioridades del plan: Matemática, exámenes escritos en inglés (Language Arts y Natural Science).</p></section>';}
  h+=voiceCardHtml();
  if(sch&&sch.days){const days=Object.keys(sch.days);h+='<section class="card"><h2>Horario de clases 4°C</h2><div class="tbl" style="margin-top:8px"><table><thead><tr><th>Hora</th>'+days.map(d=>'<th>'+esc(d)+'</th>').join("")+'</tr></thead><tbody>'+(sch.hours||[]).map((hr,i)=>'<tr><td>'+esc(hr)+'</td>'+days.map(d=>'<td>'+esc(sch.days[d][i]||"")+'</td>').join("")+'</tr>').join("")+'</tbody></table></div></section>';}
  if(info.log&&info.log.length)h+='<section class="card"><h2>Registro de actualizaciones</h2><div style="margin-top:8px;display:grid;gap:6px">'+info.log.slice().reverse().map(l=>'<p><b>'+esc(l.date)+'</b> · '+esc(l.text)+'</p>').join("")+'</div></section>';

  main.innerHTML=h;

  bindVoice();
  $("#todoForm").onsubmit=ev=>{ev.preventDefault();const v=$("#todoIn").value.trim();if(!v)return;write(S.db.collection("todos").add({text:v,done:false,order:Date.now(),added:today()}),"Pendiente agregado")};
  $("#evForm").onsubmit=ev=>{ev.preventDefault();write(S.db.collection("events").add({date:$("#evDate").value,subject:$("#evSub").value,kind:$("#evKind").value,title:$("#evTitle").value.trim(),detail:$("#evDetail").value.trim(),topics:[],done:false}),"Fecha guardada")};
  $("#tpForm").onsubmit=ev=>{ev.preventDefault();write(S.db.collection("topics").add({subject:$("#tpSub").value,quim:2,status:"actual",priority:1,title:$("#tpTitle").value.trim(),kid:$("#tpKid").value.trim(),points:$("#tpPts").value.split("\n").map(s=>s.trim()).filter(Boolean),quiz:[],order:Date.now(),added:today(),source:"papas"}),"Tema guardado")};

function voiceCardHtml(){
  const opts=pre=>voices.filter(v=>(v.lang||"").toLowerCase().startsWith(pre)).sort((a,b)=>voiceScore(b,pre==="en"?"en-US":"es-US")-voiceScore(a,pre==="en"?"en-US":"es-US"));
  const sel=(id,pre,key,lang)=>{const cur=store.get(key,""),auto=bestVoice(lang);return '<select id="'+id+'"><option value="">Automática (la más natural: '+esc(auto?auto.name:"ninguna")+')</option>'+opts(pre).map(v=>'<option value="'+esc(v.name)+'"'+(cur===v.name?' selected':'')+'>'+esc(v.name)+' · '+esc(v.lang)+'</option>').join("")+'</select>'};
  const rate=store.get("voiceRate",1);

    (hasVoice("es-US")?'':'<p class="feedback no small"><b>Este equipo no tiene voz en español.</b> Las instrucciones se muestran escritas pero no se leen. Instala una voz en español (mira las guías de abajo) y recarga la página.</p>')+
    '<label class="toggle" for="autoread"><input type="checkbox" id="autoread"'+(store.get("autoread",true)?' checked':'')+'> Leer en voz alta las preguntas en inglés</label>'+
    '<label class="toggle" for="autoInstr"><input type="checkbox" id="autoInstr"'+(store.get("autoInstr",true)?' checked':'')+'> Leer en voz alta las instrucciones la primera vez que aparece cada ejercicio</label>'+
    '<button class="btn small soft" id="tBlank">'+SPEAK+' Probar pausa en espacio en blanco</button>'+
    '<label class="f" for="vRate">Velocidad: <span id="vRateL">'+Math.round(rate*100)+'%</span><input type="range" id="vRate" min="0.7" max="1.15" step="0.05" value="'+rate+'"></label>'+
    '<details class="small"><summary><b>¿Suena robótica? Cómo conseguir voces más naturales</b></summary><ul style="margin:8px 0 0;padding-left:20px;line-height:1.7">'+
    '<li><b>Computadora Windows:</b> abre la página en <b>Microsoft Edge</b>. Trae voces naturales como «Microsoft Ana Online (Natural)» en inglés y «Microsoft Dalia Online (Natural)» en español. En Chrome, elige «Google US English» y «Google español de Estados Unidos».</li>'+

    '<li><b>Tablet Android:</b> Ajustes → Accesibilidad → Salida de texto a voz → motor de Google → instala los datos de voz de Español (Estados Unidos) e Inglés (Estados Unidos).</li>'+
    '<li><b>iPad:</b> Ajustes → Accesibilidad → Contenido leído → Voces → descarga una voz «Mejorada» o «Premium» en español (Paulina o Mónica) y en inglés (Samantha o Ava). Luego recarga la página.</li></ul></details></section>';
}
function bindVoice(){
  const vEn=$("#vEn"),vEs=$("#vEs"),vr=$("#vRate");if(!vEn)return;
  vEn.onchange=()=>{store.set("voiceEn",vEn.value);say("Hello Thiago! This is a butterfly. It can fly.","en-US")};
  vEs.onchange=()=>{store.set("voiceEs",vEs.value);say("¡Hola Thiago! Vamos a entrenar juntos.","es-US")};
  $("#tEn").onclick=()=>say("Hello Thiago! This is a butterfly. It is small and colorful. It can fly.","en-US");
  $("#tEs").onclick=()=>say("¡Hola Thiago! Hoy vamos a repasar las tablas de multiplicar. ¡Tú puedes!","es-US");

(async()=>{

})();
